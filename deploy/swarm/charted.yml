version: "3.9"
services:
  charted:
    image: 10.10.20.200:5000/charted:stg-latest
    networks:
      - edge
    environment:
      - CONVEX_DEPLOYMENT=content-iguana-935
      - CONVEX_SITE_URL=https://content-iguana-935.convex.site
      - JWKS=${JWKS}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - NEXT_PUBLIC_CONVEX_URL=https://content-iguana-935.convex.site
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=edge
        - traefik.http.routers.charted-stg.rule=Host(`charted.fridaybuilt.com`)
        - traefik.http.routers.charted-stg.entrypoints=web
        - traefik.http.services.charted-stg.loadbalancer.server.port=3000

networks:
  edge:
    external: true
